<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rekap Nilai – Guru</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mu:#5b6475;--ln:#d9dde4;--ac:#1f3a6e}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--tx:#e8ebf1;--mu:#98a1b3;--ln:#333b4b;--ac:#8fb0ee}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
h1{font-size:1.2rem;color:var(--ac);margin:0 0 4px}.mu{color:var(--mu);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input,button{font:inherit;padding:8px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx)}
button{background:var(--ac);color:var(--bg);border:0;cursor:pointer}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--ln);padding:6px 8px;text-align:left;font-size:.9rem}th{background:var(--bg)}
td input{width:54px;padding:4px}.n{font-weight:bold;color:var(--ac)}
details{margin:2px 0}summary{cursor:pointer;color:var(--ac)}
.ans{background:var(--bg);padding:8px;border-radius:6px;margin:6px 0;white-space:pre-wrap}
</style></head><body>
<h1>Rekap Asesmen Sumatif – Teks Eksplanasi</h1>
<div class="mu">Nilai = PG <span id="w1"></span>% + Menjodohkan <span id="w2"></span>% + Uraian <span id="w3"></span>%. Skor uraian (0–10 per soal) diisi guru; tersimpan di browser ini.</div>
<div class="bar"><input type="password" id="k" placeholder="Kunci guru"><button onclick="muat()">Muat Data</button><button onclick="csv()">Unduh CSV</button><span class="mu" id="st"></span></div>
<div class="scroll"><table id="t"></table></div>
<script src="soal.js"></script>
<script>
const W=[50,20,30]; // bobot PG, menjodohkan, uraian (ubah di sini)
['w1','w2','w3'].forEach((id,i)=>document.getElementById(id).textContent=W[i]);
let D=[],S=JSON.parse(localStorage.getItem('skorUraian')||'{}');
const id=d=>d.kelas+'|'+d.absen+'|'+d.nama.toLowerCase();
function nilai(d){const u=S[id(d)]||[];const su=u.reduce((a,b)=>a+(+b||0),0);
 return (d.pg/PG.length*W[0]+d.cocok/CM.a.length*W[1]+su/(UR.length*10)*W[2]).toFixed(1)}
async function muat(){
 const k=document.getElementById('k').value;
 if(!API_URL){alert('API_URL belum diisi di soal.js');return}
 try{const r=await fetch(API_URL+'?key='+encodeURIComponent(k));const j=await r.json();
  if(j.error){alert('Kunci salah');return}
  const m={};j.forEach(d=>m[id(d)]=d); // pengiriman terakhir per siswa
  D=Object.values(m).sort((a,b)=>(a.kelas+String(a.absen).padStart(3,'0')).localeCompare(b.kelas+String(b.absen).padStart(3,'0')));
  document.getElementById('st').textContent=D.length+' siswa';draw()}
 catch(e){alert('Gagal memuat data: '+e)}}
function draw(){
 let h='<tr><th>No</th><th>Nama</th><th>Kelas</th><th>Absen</th><th>PG (/15)</th><th>Jodoh (/5)</th><th>Uraian 1–5 (0–10)</th><th>Nilai</th></tr>';
 D.forEach((d,i)=>{const u=S[id(d)]||[];
  h+=`<tr><td>${i+1}</td><td>${esc(d.nama)}<details><summary>Jawaban uraian</summary>${d.ur.map((a,j)=>`<div class="ans"><b>U${j+1}:</b> ${esc(a)||'<i>(kosong)</i>'}\n<span class="mu"><b>Pedoman:</b> ${UR[j].k}</span></div>`).join('')}</details></td><td>${esc(d.kelas)}</td><td>${d.absen}</td><td>${d.pg}</td><td>${d.cocok}</td><td>${[0,1,2,3,4].map(j=>`<input type="number" min="0" max="10" value="${u[j]??''}" onchange="sk(${i},${j},this.value)">`).join(' ')}</td><td class="n" id="n${i}">${nilai(d)}</td></tr>`});
 document.getElementById('t').innerHTML=h}
function sk(i,j,v){const k=id(D[i]);S[k]=S[k]||[];S[k][j]=v===''?'':Math.min(10,Math.max(0,+v));
 localStorage.setItem('skorUraian',JSON.stringify(S));document.getElementById('n'+i).textContent=nilai(D[i])}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function csv(){const r=[['Nama','Kelas','Absen','PG','Menjodohkan','U1','U2','U3','U4','U5','Nilai']];
 D.forEach(d=>{const u=S[id(d)]||[];r.push([d.nama,d.kelas,d.absen,d.pg,d.cocok,...[0,1,2,3,4].map(j=>u[j]??''),nilai(d)])});
 const b=new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nilai-asesmen.csv';a.click()}
</script></body></html>
